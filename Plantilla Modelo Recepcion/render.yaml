# Plantilla de despliegue en Render. Al replicar este agente para un negocio
# nuevo: cambia "name" y ajusta "rootDir" a la carpeta real del proyecto
# (usa un nombre sin espacios, ej. "mi-negocio-bot").
services:
  - type: web
    name: nombre-del-negocio-bot
    runtime: node
    plan: free
    rootDir: nombre-de-la-carpeta-del-proyecto
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: PUBLIC_URL
        sync: false
